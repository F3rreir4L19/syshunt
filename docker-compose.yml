version: "3.9"

# Base compose — safe for VPS and production use.
# No internal services are exposed to external interfaces.
# Dashboard binds to 127.0.0.1 only; access via SSH tunnel or Tailscale.
#
# For local development with exposed ports, overlay docker-compose.local.yml:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   (or: make up-local)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bughunter
      POSTGRES_USER: bughunter
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bughunter_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bughunter"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://bughunter:${DB_PASSWORD:-bughunter_dev}@db:5432/bughunter
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - HACKERONE_API_TOKEN=${HACKERONE_API_TOKEN:-}
      - BUGCROWD_API_TOKEN=${BUGCROWD_API_TOKEN:-}
      - RECON_CONCURRENCY=${RECON_CONCURRENCY:-10}
      - NUCLEI_RATE_LIMIT=${NUCLEI_RATE_LIMIT:-150}
    volumes:
      - ./core:/app/core
      - ./tools:/app/tools
      - recon_output:/app/output
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core.pipeline.tasks worker --loglevel=info --concurrency=4

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://bughunter:${DB_PASSWORD:-bughunter_dev}@db:5432/bughunter
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db
    command: celery -A core.pipeline.tasks beat --loglevel=info

  flower:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A core.pipeline.tasks flower --port=5555

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      - DATABASE_URL=postgresql://bughunter:${DB_PASSWORD:-bughunter_dev}@db:5432/bughunter
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./dashboard:/app/dashboard
      - recon_output:/app/output:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  recon_output:
